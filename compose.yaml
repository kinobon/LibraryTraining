name: library-training

services:
  oracle:
    image: container-registry.oracle.com/database/free:23.26.3.0
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      # 新規ローカル環境用のサンプル値。既存DBの資格情報は転記しない。
      ORACLE_PWD: "LocalTraining123"
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data: